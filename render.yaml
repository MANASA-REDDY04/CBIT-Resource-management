# ==============================================================================
# CBIT RESOURCE HUB - RENDER BLUEPRINT SPECIFICATION (Native Services, No Docker)
# ==============================================================================

databases:
  - name: cbit-resource-hub-db
    databaseName: cbit_resource_hub
    user: cbit_admin
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  # ----------------------------------------------------------------------------
  # 1. FASTAPI BACKEND WEB SERVICE
  # ----------------------------------------------------------------------------
  - type: web
    name: cbit-resource-hub-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cbit-resource-hub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_URL
        fromService:
          type: web
          name: cbit-resource-hub-web
          property: host

  # ----------------------------------------------------------------------------
  # 2. NEXT.JS FRONTEND WEB SERVICE
  # ----------------------------------------------------------------------------
  - type: web
    name: cbit-resource-hub-web
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: cbit-resource-hub-api
          property: host

